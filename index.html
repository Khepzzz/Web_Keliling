<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catatan Keliling Lapangan</title>
<style>
  :root {
    --bg:#eef2f1; --surface:#fff; --ink:#18262b; --muted:#5d6f75; --line:#d5dedd;
    --brand:#0f5c66; --brand-d:#0a444c; --ok:#1b7a4b; --warn:#a86a00; --bad:#b3372f;
    --ok-bg:#e2f3ea; --warn-bg:#fdf0d5; --bad-bg:#fbe5e3;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#10191c; --surface:#18262b; --ink:#e8f0f1; --muted:#97aaae; --line:#2b3d43;
      --brand:#3fb0bd; --brand-d:#5cc5d1; --ok:#6fd49c; --warn:#f0be5b; --bad:#f08a82;
      --ok-bg:#16382a; --warn-bg:#3b2f12; --bad-bg:#3d1f1c; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  .hidden { display:none !important; }
  header { display:flex; justify-content:space-between; align-items:center; padding:14px 20px; background:var(--brand); color:#fff; }
  header h1 { margin:0; font-size:1.15rem; }
  header button { width:auto; margin:0; padding:8px 14px; background:rgba(255,255,255,.18); font-size:.9rem; }
  .wrap { max-width:980px; margin:0 auto; padding:16px; }
  .tabs { display:flex; gap:6px; margin-bottom:14px; border-bottom:2px solid var(--line); }
  .tab { width:auto; margin:0 0 -2px; flex:1; max-width:220px; background:none; color:var(--muted); border-radius:8px 8px 0 0; border-bottom:2px solid transparent; }
  .tab:hover { background:var(--surface); color:var(--ink); }
  .tab.on { color:var(--brand); border-bottom-color:var(--brand); background:var(--surface); }
  .filters { display:grid; grid-template-columns:1fr 1fr; gap:0 10px; }
  .filters .full { grid-column:1 / -1; }
  .filters label { margin-top:8px; }
  .pager { display:flex; justify-content:center; align-items:center; gap:4px; flex-wrap:wrap; margin-top:14px; }
  .pager button { width:auto; min-width:38px; margin:0; padding:7px 11px; background:var(--surface); color:var(--ink); border:1px solid var(--line); font-weight:500; }
  .pager button:hover:not(:disabled) { background:var(--bg); }
  .pager button.cur { background:var(--brand); color:#fff; border-color:var(--brand); }
  .pager button:disabled { opacity:.45; cursor:default; }
  .pager span { color:var(--muted); padding:0 4px; }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:18px; }
  .card h2 { margin:0 0 12px; font-size:1.05rem; }
  label { display:block; font-size:.85rem; font-weight:600; color:var(--muted); margin-top:12px; }
  input, textarea, select, button { width:100%; font:inherit; padding:11px 12px; margin-top:4px; border:1px solid var(--line); border-radius:8px; background:var(--surface); color:var(--ink); }
  input:focus, textarea:focus, select:focus, button:focus-visible { outline:2px solid var(--brand); outline-offset:1px; }
  button { background:var(--brand); color:#fff; font-weight:600; border:0; cursor:pointer; }
  button:hover { background:var(--brand-d); }
  button:disabled { opacity:.6; cursor:wait; }
  .btn-row { display:flex; gap:8px; flex-wrap:wrap; }
  .btn-row button { flex:1; min-width:140px; margin:0; }
  .btn-x { background:#1b7a4b; } .btn-p { background:#8a3a34; }
  .login { max-width:380px; margin:12vh auto 0; }
  .err { color:var(--bad); font-size:.9rem; min-height:1.2em; margin:8px 0 0; }
  .toast { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:8px; font-size:.9rem; z-index:9; max-width:90vw; }
  .badge { display:inline-block; padding:2px 10px; border-radius:99px; font-size:.8rem; font-weight:600; white-space:nowrap; }
  .b-ok { background:var(--ok-bg); color:var(--ok); } .b-warn { background:var(--warn-bg); color:var(--warn); } .b-bad { background:var(--bad-bg); color:var(--bad); }
  .empty { text-align:center; color:var(--muted); padding:28px 0; }
  .btn-del { width:auto; margin:0; padding:6px 12px; font-size:.85rem; background:var(--bad-bg); color:var(--bad); }
  .btn-del:hover { background:var(--bad); color:#fff; }
  .count { color:var(--muted); font-size:.85rem; margin:8px 0 0; }

  /* Tabel di desktop, kartu di mobile */
  table { width:100%; border-collapse:collapse; margin-top:10px; font-size:.9rem; }
  th, td { padding:10px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
  th { color:var(--muted); font-size:.8rem; }
  @media (max-width:719px) {
    thead { display:none; }
    table, tbody, tr, td { display:block; width:100%; }
    tr { border:1px solid var(--line); border-radius:10px; padding:8px 12px; margin-bottom:10px; }
    td { border:0; padding:4px 0; display:flex; gap:10px; justify-content:space-between; text-align:right; }
    td::before { content:attr(data-l); color:var(--muted); font-size:.8rem; font-weight:600; text-align:left; flex:0 0 90px; }
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
</head>
<body>

<section id="loginSection" class="card login">
  <h2>Masuk</h2>
  <label for="passInput">Password</label>
  <input type="password" id="passInput" autocomplete="current-password">
  <p class="err" id="loginErr"></p>
  <button id="loginBtn">Masuk</button>
</section>

<div id="mainSection" class="hidden">
  <header><h1>Catatan Keliling Lapangan</h1><button id="logoutBtn">Keluar</button></header>
  <main class="wrap">
    <div class="tabs" role="tablist">
      <button class="tab on" id="tabInput" role="tab" data-tab="input">Input</button>
      <button class="tab" id="tabRiwayat" role="tab" data-tab="riwayat">Riwayat (0)</button>
    </div>

    <section class="card" id="panelInput">
      <h2>Input data klien</h2>
      <label for="nama">Nama calon klien / toko *</label>
      <input id="nama" maxlength="100">
      <label for="alamat">Alamat / lokasi</label>
      <input id="alamat" maxlength="200">
      <label for="hp">No HP / WA</label>
      <input id="hp" type="tel" inputmode="tel" placeholder="08123456789">
      <label for="statusKlien">Respon klien</label>
      <select id="statusKlien">
        <option>Tertarik / Mau</option>
        <option>Ragu-ragu / Pikir-pikir</option>
        <option>Menolak / Tidak Mau</option>
      </select>
      <div id="wrapperEstimasi">
        <label for="estimasiBarang">Estimasi kirim per minggu</label>
        <input id="estimasiBarang" placeholder="Contoh: 5 dus" maxlength="60">
      </div>
      <label for="keluhKesah">Catatan hasil obrolan</label>
      <textarea id="keluhKesah" rows="4" maxlength="800"></textarea>
      <p class="err" id="formErr"></p>
      <button id="saveBtn">Simpan data</button>
    </section>

    <section class="card hidden" id="panelRiwayat">
      <h2>Riwayat data</h2>
      <div class="filters">
        <div class="full">
          <label for="searchFilter">Cari</label>
          <input id="searchFilter" type="search" placeholder="Nama, alamat, atau catatan">
        </div>
        <div>
          <label for="statusFilter">Status</label>
          <select id="statusFilter">
            <option value="">Semua</option>
            <option value="Tertarik">Tertarik</option>
            <option value="Ragu">Ragu-ragu</option>
            <option value="Menolak">Menolak</option>
          </select>
        </div>
        <div>
          <label for="perPage">Tampilkan per halaman</label>
          <select id="perPage">
            <option>10</option><option>25</option><option>50</option><option>100</option>
          </select>
        </div>
      </div>
      <p class="count" id="count"></p>
      <div class="btn-row" style="margin-top:10px">
        <button class="btn-x" id="xlsBtn">Unduh Excel</button>
        <button class="btn-p" id="pdfBtn">Unduh PDF</button>
      </div>
      <table id="dataTable">
        <thead><tr><th>Waktu</th><th>Nama</th><th>Alamat</th><th>No HP</th><th>Status</th><th>Est./minggu</th><th>Catatan</th><th></th></tr></thead>
        <tbody id="tableBody"></tbody>
      </table>
      <div class="empty hidden" id="empty"></div>
      <nav class="pager" id="pager" aria-label="Halaman"></nav>
    </section>
  </main>
</div>

<script>
  // Ganti dengan URL Web App (berakhiran /exec)
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx7BaH87ogbbpuKYctBx8k1lRjJd1yFM0SttL2hPoiqEj7y7mX90tNCidWPRY6lZl4v/exec";

  const $ = id => document.getElementById(id);
  let password = sessionStorage.getItem("pw") || "";
  let allData = [];

  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
  const fmtTime = iso => { const d = new Date(iso); return isNaN(d) ? esc(iso) : d.toLocaleString("id-ID", { dateStyle:"medium", timeStyle:"short" }); };
  const badge = s => `<span class="badge ${s.startsWith("Tertarik") ? "b-ok" : s.startsWith("Ragu") ? "b-warn" : "b-bad"}">${esc(s)}</span>`;

  function toast(msg) {
    const t = document.createElement("div");
    t.className = "toast"; t.textContent = msg; document.body.appendChild(t);
    setTimeout(() => t.remove(), 2800);
  }

  async function api(payload) {
    if (!SCRIPT_URL.startsWith("https://script.google.com/")) throw new Error("SCRIPT_URL belum diisi dengan URL Web App Apps Script.");
    const res = await fetch(SCRIPT_URL, { method:"POST", body:JSON.stringify({ ...payload, password }) });
    if (!res.ok) throw new Error("Server membalas error " + res.status);
    const data = await res.json();
    if (data.status !== "success") throw new Error(data.message || "Terjadi kesalahan.");
    return data;
  }

  async function busy(btn, fn) {
    if (btn.disabled) return;
    const label = btn.textContent; btn.disabled = true; btn.textContent = "Memproses...";
    try { await fn(); } finally { btn.disabled = false; btn.textContent = label; }
  }

  function showApp() { $("loginSection").classList.add("hidden"); $("mainSection").classList.remove("hidden"); muatRiwayat(); }
  function logout() { sessionStorage.removeItem("pw"); password = ""; location.reload(); }

  $("loginBtn").onclick = () => busy($("loginBtn"), async () => {
    $("loginErr").textContent = "";
    password = $("passInput").value;
    try { await api({ action:"login" }); sessionStorage.setItem("pw", password); showApp(); }
    catch (e) { password = ""; $("loginErr").textContent = e.message; }
  });
  $("passInput").onkeydown = e => { if (e.key === "Enter") $("loginBtn").click(); };
  $("logoutBtn").onclick = logout;

  function toggleEstimasi() {
    const on = $("statusKlien").value.startsWith("Tertarik");
    $("wrapperEstimasi").classList.toggle("hidden", !on);
    if (!on) $("estimasiBarang").value = "";
  }
  $("statusKlien").onchange = toggleEstimasi;

  $("saveBtn").onclick = async () => {
    const err = $("formErr"); err.textContent = "";
    const nama = $("nama").value.trim(), hp = $("hp").value.trim();
    if (!nama) { err.textContent = "Nama wajib diisi."; return; }
    if (hp && !/^\+?[\d\s-]{8,16}$/.test(hp)) { err.textContent = "No HP valid 8-16 angka."; return; }
    const f = { nama, alamat:$("alamat").value, hp, statusKlien:$("statusKlien").value,
                estimasiBarang:$("estimasiBarang").value, keluhKesah:$("keluhKesah").value };
    // Tampilkan langsung, kirim ke server di belakang
    const row = { id:"tmp" + Date.now(), pending:true, waktu:new Date().toISOString(), nama:f.nama, alamat:f.alamat,
                  hp:f.hp, status:f.statusKlien, estimasi:f.estimasiBarang || "-", catatan:f.keluhKesah };
    allData.unshift(row); render();
    ["nama","alamat","hp","estimasiBarang","keluhKesah"].forEach(id => $(id).value = "");
    $("statusKlien").value = "Tertarik / Mau"; toggleEstimasi();
    try {
      const res = await api({ action:"save", ...f });
      row.id = res.id; row.pending = false; render(); toast("Data tersimpan");
    } catch (e) {
      allData = allData.filter(r => r !== row); render();
      // kembalikan isian supaya tidak perlu mengetik ulang
      $("nama").value = f.nama; $("alamat").value = f.alamat; $("hp").value = f.hp;
      $("statusKlien").value = f.statusKlien; toggleEstimasi();
      $("estimasiBarang").value = f.estimasiBarang; $("keluhKesah").value = f.keluhKesah;
      err.textContent = "Gagal menyimpan: " + e.message;
    }
  };

  async function muatRiwayat() {
    try { allData = (await api({ action:"list" })).data; render(); }
    catch (e) { toast("Gagal memuat data: " + e.message); }
  }

  let page = 1, perPage = 10;

  function filtered() {
    const q = $("searchFilter").value.toLowerCase().trim();
    const st = $("statusFilter").value;
    return allData.filter(r =>
      (!st || r.status.startsWith(st)) &&
      (!q || [r.nama, r.alamat, r.hp, r.status, r.catatan].join(" ").toLowerCase().includes(q)));
  }

  function pageList(cur, last) {
    const set = new Set([1, last, cur - 1, cur, cur + 1].filter(n => n >= 1 && n <= last));
    const out = []; let prev = 0;
    [...set].sort((x, y) => x - y).forEach(n => { if (n - prev > 1) out.push("..."); out.push(n); prev = n; });
    return out;
  }

  function render() {
    const rows = filtered(), total = rows.length;
    const pages = Math.max(1, Math.ceil(total / perPage));
    if (page > pages) page = pages;
    const start = (page - 1) * perPage, slice = rows.slice(start, start + perPage);

    $("tabRiwayat").textContent = `Riwayat (${allData.length})`;
    $("tableBody").innerHTML = slice.map(r => `<tr>
      <td data-l="Waktu">${fmtTime(r.waktu)}</td>
      <td data-l="Nama"><strong>${esc(r.nama)}</strong></td>
      <td data-l="Alamat">${esc(r.alamat)}</td>
      <td data-l="No HP">${esc(r.hp)}</td>
      <td data-l="Status">${badge(r.status)}</td>
      <td data-l="Est./minggu">${esc(r.estimasi)}</td>
      <td data-l="Catatan">${esc(r.catatan)}</td>
      <td><button class="btn-del" data-id="${esc(r.id)}" data-nama="${esc(r.nama)}" ${r.pending ? "disabled" : ""}>${r.pending ? "Menyimpan..." : "Hapus"}</button></td>
    </tr>`).join("");

    $("dataTable").classList.toggle("hidden", total === 0);
    $("empty").classList.toggle("hidden", total > 0);
    $("empty").textContent = allData.length ? "Tidak ada data yang cocok dengan filter." : "Belum ada data. Isi form di tab Input untuk mulai mencatat.";
    $("count").textContent = total
      ? `Menampilkan ${start + 1}-${start + slice.length} dari ${total} data` + (total !== allData.length ? ` (difilter dari ${allData.length})` : "")
      : "";

    const pg = $("pager");
    if (pages <= 1) { pg.innerHTML = ""; return; }
    pg.innerHTML = `<button data-p="${page - 1}" ${page === 1 ? "disabled" : ""}>&lsaquo; Sebelumnya</button>`
      + pageList(page, pages).map(n => n === "..." ? "<span>...</span>" : `<button data-p="${n}" class="${n === page ? "cur" : ""}">${n}</button>`).join("")
      + `<button data-p="${page + 1}" ${page === pages ? "disabled" : ""}>Berikutnya &rsaquo;</button>`;
  }

  // Setiap filter berubah, kembali ke halaman 1
  const resetRender = () => { page = 1; render(); };
  $("searchFilter").oninput = resetRender;
  $("statusFilter").onchange = resetRender;
  $("perPage").onchange = () => { perPage = parseInt($("perPage").value, 10); resetRender(); };
  $("pager").onclick = e => {
    const b = e.target.closest("button[data-p]"); if (!b || b.disabled) return;
    page = parseInt(b.dataset.p, 10); render(); $("tabRiwayat").scrollIntoView({ block:"start", behavior:"smooth" });
  };

  function showTab(name) {
    const isIn = name === "input";
    $("panelInput").classList.toggle("hidden", !isIn);
    $("panelRiwayat").classList.toggle("hidden", isIn);
    $("tabInput").classList.toggle("on", isIn);
    $("tabRiwayat").classList.toggle("on", !isIn);
  }
  document.querySelectorAll(".tab").forEach(t => t.onclick = () => showTab(t.dataset.tab));

  // Event delegation: aman untuk nama yang mengandung tanda petik
  $("tableBody").onclick = async e => {
    const btn = e.target.closest(".btn-del"); if (!btn || btn.disabled) return;
    if (!confirm(`Hapus data "${btn.dataset.nama}"?`)) return;
    const idx = allData.findIndex(r => r.id === btn.dataset.id); if (idx < 0) return;
    const [removed] = allData.splice(idx, 1); render();   // hilang langsung dari layar
    try { await api({ action:"delete", id:removed.id }); toast("Data dihapus"); }
    catch (err) { allData.splice(idx, 0, removed); render(); toast("Gagal menghapus: " + err.message); }
  };

  // Export memakai data yang sedang terfilter, tanpa kolom Aksi
  function exportRows() {
    return filtered().map(r => ({ Waktu:new Date(r.waktu).toLocaleString("id-ID"), Nama:r.nama, Alamat:r.alamat,
      "No HP":r.hp, Status:r.status, "Est. Barang/Mgg":r.estimasi, "Keluh Kesah":r.catatan }));
  }
  $("xlsBtn").onclick = () => {
    const rows = exportRows(); if (!rows.length) return toast("Tidak ada data untuk diunduh");
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), "Rekap");
    XLSX.writeFile(wb, "Rekap_Keliling.xlsx");
  };
  $("pdfBtn").onclick = () => {
    const rows = exportRows(); if (!rows.length) return toast("Tidak ada data untuk diunduh");
    if (!window.jspdf) return toast("Library PDF belum termuat. Periksa koneksi internet.");
    const doc = new window.jspdf.jsPDF({ orientation:"landscape", format:"a4" });
    const keys = Object.keys(rows[0]);
    const clean = v => String(v ?? "").replace(/[^\u0000-\u00FF]/g, "");  // font PDF tidak mendukung emoji
    doc.setFontSize(13); doc.text("Rekap Keliling Lapangan", 14, 14);
    doc.setFontSize(9); doc.text(`Dicetak ${new Date().toLocaleString("id-ID")} - ${rows.length} data`, 14, 19);
    doc.autoTable({
      startY: 23, margin: { left:14, right:14 },
      head: [keys], body: rows.map(r => keys.map(k => clean(r[k]))),
      styles: { fontSize:8, cellPadding:2, textColor:0 },
      headStyles: { fillColor:[15, 92, 102], textColor:255 },
      columnStyles: { 6: { cellWidth:60 } }
    });
    doc.save("Rekap_Keliling.pdf");
  };

  toggleEstimasi();
  if (password) showApp();
</script>
</body>
</html>
