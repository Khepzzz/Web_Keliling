<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catatan Keliling Lapangan</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
</head>
<body>
<section id="loginSection" class="card login">
  <h2>Masuk</h2>
  <label for="passInput">Password</label>
  <div class="pw">
  <input type="password" id="passInput" autocomplete="current-password" enterkeyhint="go">
  <button type="button" class="eye" id="eyeBtn" aria-label="Tampilkan password"><svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path class="slash" d="M4 4l16 16"/></svg></button>
</div>
  <p class="err" id="loginErr"></p>
  <button id="loginBtn" style="width:100%">Masuk</button>
</section>

<div id="mainSection" class="app hidden">
  <nav class="side">
    <h1>Catatan Keliling</h1>
    <button class="nav on" data-v="dash"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg>Dashboard</button>
    <button class="nav" data-v="input"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>Input</button>
    <button class="nav" data-v="riwayat"><svg viewBox="0 0 24 24"><path d="M4 6h.01M4 12h.01M4 18h.01M9 6h12M9 12h12M9 18h12"/></svg>Riwayat</button>
    <button class="nav" data-v="spk"><svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 14l2 2 4-4"/></svg>Supplier</button>
    <button class="nav" data-v="peta"><svg viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>Peta</button>
    <button class="nav out" id="logoutBtn"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>Keluar</button>
  </nav>
  <main>
    <section id="v-dash" class="view">
      <div class="rh"><h2 style="margin:0">Dashboard</h2>
        <select id="period" style="width:auto"><option value="7">7 hari</option><option value="30" selected>30 hari</option><option value="90">90 hari</option><option value="0">Semua</option></select></div>
      <div class="grid" id="stats" style="margin-top:12px"></div>
      <div class="two">
        <div class="card"><h2>Klien per status</h2><div id="barStatus"></div></div>
        <div class="card"><h2>Data baru per minggu</h2><div class="wk" id="wk"></div></div>
      </div>
      <div class="two">
        <div class="card"><h2>Perlu di-follow-up</h2><div id="fuList"></div></div>
        <div class="card"><h2>Jadwal kroscek</h2><div id="kJadwal"></div></div>
        <div class="card"><h2>Barang di service</h2><div id="svcList"></div></div>
        <div class="card"><h2>SPK mau jatuh tempo</h2><div id="spkDue"></div></div>
        <div class="card"><h2>Aktivitas terbaru</h2><div id="recent"></div></div>
      </div>
    </section>

    <section id="v-input" class="view hidden">
      <h2>Input data klien</h2>
      <div class="card"><div id="formInput"></div><button id="saveBtn" style="width:100%">Simpan data</button></div>
    </section>

    <section id="v-riwayat" class="view hidden">
      <h2>Riwayat data</h2>
      <div class="card">
        <div class="filters">
          <div class="full"><label for="q">Cari</label><input id="q" type="search" placeholder="Nama, alamat, atau catatan"></div>
          <div><label for="stF">Status</label><select id="stF"></select></div>
          <div><label for="pp">Tampil per halaman</label><select id="pp"><option>10</option><option>25</option><option>50</option></select></div>
        </div>
        <p class="muted" id="count"></p>
        <div class="btn-row"><button class="btn-s" id="xlsBtn">Unduh Excel</button><button class="btn-s" id="pdfBtn">Unduh PDF</button></div>
      </div>
      <div id="list"></div>
      <div class="pager" id="pager"></div>
    </section>

    <section id="v-spk" class="view hidden">
      <h2>Supplier SPK</h2>
      <div id="spkList"></div>
    </section>

    <section id="v-detail" class="view hidden"></section>
    <section id="v-spkd" class="view hidden"></section>

    <section id="v-peta" class="view hidden">
      <div class="rh"><h2 style="margin:0">Peta</h2><select id="mapSt" style="width:auto"></select></div>
      <div class="legend" id="legend"></div>
      <div id="map"></div>
      <p class="muted" id="mapInfo"></p>
    </section>
  </main>
</div>

<div id="lb" role="dialog" aria-modal="true" aria-label="Foto">
  <img id="lbImg" alt="Foto" class="hidden">
  <span id="lbMsg"></span>
  <button type="button" class="lbb" id="lbDl" aria-label="Unduh foto"><svg viewBox="0 0 24 24"><path d="M12 4v11"/><path d="m7.5 11 4.5 4.5 4.5-4.5"/><path d="M5 20h14"/></svg></button>
  <button type="button" class="lbb" id="lbX" aria-label="Tutup"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  <button type="button" class="lbb" id="lbP" aria-label="Foto sebelumnya"><svg viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg></button>
  <button type="button" class="lbb" id="lbN" aria-label="Foto berikutnya"><svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></button>
  <div id="lbC"></div>
</div>

<dialog id="spkModal"><h2 style="margin-top:0" id="spkTitle">SPK baru</h2>
  <label>Tanggal mulai</label><input id="sp_m" type="date">
  <label>Tanggal selesai</label><input id="sp_s" type="date">
  <label>Target jumlah (angka, wajib)</label><input id="sp_t" type="number" inputmode="numeric" min="1" step="1" placeholder="Contoh: 100">
  <label>Keterangan jumlah (opsional)</label><input id="sp_j" maxlength="40" placeholder="Contoh: 100 dus">
  <label>Catatan (opsional)</label><textarea id="sp_c" rows="2" maxlength="300"></textarea>
  <p class="err" id="sp_err"></p>
  <div class="btn-row"><button class="btn-s" id="spCancel">Batal</button><button id="spSave">Simpan SPK</button></div>
</dialog>

<dialog id="ambilModal"><h2 style="margin-top:0">Catat pengambilan</h2>
  <label>Tanggal</label><input id="ab_t" type="date">
  <label>Jenis</label><select id="ab_j"><option>Cek awal</option><option>Cek ulang</option></select>
  <p class="hint" id="ab_info"></p>
  <div id="ab_wS"><label>Siap (pcs yang dibilang siap oleh supplier)</label><input id="ab_s" type="number" inputmode="numeric" min="0" step="1"></div>
  <label>Diambil (pcs)</label><input id="ab_d" type="number" inputmode="numeric" min="0" step="1">
  <div id="ab_wX"><label>Ditolak (pcs)</label><input id="ab_x" type="number" inputmode="numeric" min="0" step="1"></div>
  <label>Catatan (opsional)</label><textarea id="ab_c" rows="2" maxlength="300"></textarea>
  <p class="err" id="ab_err"></p>
  <div class="btn-row"><button class="btn-s" id="abCancel">Batal</button><button id="abSave">Simpan</button></div>
</dialog>

<dialog id="modal"><h2 style="margin-top:0">Edit data</h2><div id="mBody"></div>
  <div class="btn-row"><button class="btn-s" id="mCancel">Batal</button><button id="mSave">Simpan perubahan</button></div>
</dialog>

<script src="app.js"></script>
</body>
</html>
