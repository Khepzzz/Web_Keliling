<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catatan Keliling Lapangan</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
--bg:#e4f0f2;--ink:#0d1f24;--muted:#52666c;--line:rgba(255,255,255,.6);--edge:rgba(13,60,70,.10);
--surface:rgba(255,255,255,.58);--surface-s:rgba(255,255,255,.82);--field:rgba(255,255,255,.72);
--brand:#0a9aab;--brand-d:#077a88;--bad:#d1372d;--shadow:0 8px 30px rgba(13,60,70,.12)}
@media(prefers-color-scheme:dark){:root{
--bg:#071114;--ink:#eaf4f5;--muted:#9bb2b7;--line:rgba(255,255,255,.13);--edge:rgba(255,255,255,.09);
--surface:rgba(30,46,52,.55);--surface-s:rgba(30,46,52,.88);--field:rgba(255,255,255,.07);
--brand:#33b5c6;--brand-d:#52c6d6;--bad:#ff8077;--shadow:0 10px 34px rgba(0,0,0,.4)}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);background:var(--bg);font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:
radial-gradient(60vmax 60vmax at 6% 2%,rgba(10,170,185,.50),transparent 60%),
radial-gradient(55vmax 55vmax at 98% 10%,rgba(80,120,255,.38),transparent 60%),
radial-gradient(60vmax 60vmax at 72% 100%,rgba(150,90,230,.34),transparent 60%),
radial-gradient(50vmax 50vmax at 0% 92%,rgba(40,200,150,.28),transparent 60%)}
.hidden{display:none!important}

/* Tombol */
button{font:inherit;cursor:pointer;border:0;border-radius:999px;padding:10px 18px;font-weight:600;color:#fff;
background:linear-gradient(180deg,color-mix(in srgb,var(--brand) 82%,#fff),var(--brand));
box-shadow:0 4px 14px color-mix(in srgb,var(--brand) 32%,transparent);transition:transform .12s,filter .15s,background .15s}
button:hover{filter:brightness(1.07)} button:active{transform:scale(.97)} button:disabled{opacity:.6;cursor:wait}
.btn-s{background:var(--field);color:var(--ink);border:1px solid var(--line);box-shadow:none;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.btn-d{background:transparent;color:var(--bad);border:1px solid var(--line);box-shadow:none}
.btn-d:hover{background:var(--bad);color:#fff;filter:none}
.sm{padding:6px 13px;font-size:.84rem}

/* Form */
input,select,textarea{width:100%;font:inherit;padding:11px 14px;margin-top:5px;border:1px solid var(--line);border-radius:14px;background:var(--field);color:var(--ink);box-shadow:inset 0 1px 2px rgba(0,0,0,.05)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline-offset:0;box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 22%,transparent)}
label{display:block;font-size:.8rem;font-weight:600;color:var(--muted);margin-top:14px;letter-spacing:.01em}
.muted,.hint{color:var(--muted);font-size:.85rem} .hint{margin:4px 0 0}
.err{color:var(--bad);font-size:.9rem;min-height:1.2em;margin:8px 0}

/* Kaca */
.card,.stat,.side{background:var(--surface);border:1px solid var(--line);
-webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%);
box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.3)}
.card{border-radius:24px;padding:20px;margin-bottom:14px}
.card h2{margin:0 0 12px;font-size:1.05rem;font-weight:700;letter-spacing:-.01em}
.login{max-width:380px;width:calc(100% - 32px);margin:12vh auto 0;padding:28px}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
.card,.stat,.side{background:var(--surface-s)}}

/* Layout */
.app{display:flex;min-height:100vh}
.side{width:212px;position:sticky;top:12px;height:calc(100vh - 24px);margin:12px 0 12px 12px;border-radius:28px;padding:16px 10px;display:flex;flex-direction:column;gap:4px;flex:0 0 auto}
.side h1{font-size:1.1rem;font-weight:800;letter-spacing:-.02em;margin:6px 10px 16px;color:var(--brand)}
.nav{background:none;box-shadow:none;color:var(--muted);text-align:left;display:flex;gap:11px;align-items:center;padding:11px 14px;border-radius:16px}
.nav:hover{background:color-mix(in srgb,var(--ink) 7%,transparent);color:var(--ink);filter:none}
.nav.on{background:linear-gradient(180deg,color-mix(in srgb,var(--brand) 82%,#fff),var(--brand));color:#fff;box-shadow:0 6px 16px color-mix(in srgb,var(--brand) 35%,transparent)}
.nav svg{width:20px;height:20px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.side .out{margin-top:auto}
main{flex:1;min-width:0;padding:26px 24px;max-width:1040px;margin:0 auto;width:100%}
main>h2,.view>h2,.view>.rh>h2{margin:0 0 14px;font-size:1.9rem;font-weight:800;letter-spacing:-.03em}
#v-detail>h2{font-size:1.25rem;letter-spacing:-.01em;margin:6px 0 12px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px} .btn-row>button{flex:1;min-width:130px}

/* Dashboard */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:14px}
.stat{border-left:4px solid var(--c,var(--brand));border-radius:20px;padding:14px 16px}
.stat b{display:block;font-size:1.9rem;font-weight:800;line-height:1.2;letter-spacing:-.02em}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.two>.card{margin-bottom:0}
.two>.card:last-child:nth-child(odd){grid-column:1/-1}
.go{cursor:pointer;transition:background .15s,transform .15s,border-color .15s}
.stat.go:hover{transform:translateY(-3px);border-color:var(--c,var(--brand))}
.li.go:hover,.bar.go:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.bar{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:.85rem;border-radius:10px}
.bar>span:first-child{width:84px;flex:0 0 auto}
.bar>div{flex:1;background:color-mix(in srgb,var(--ink) 9%,transparent);border-radius:99px;height:16px;overflow:hidden}
.bar>div>div{height:100%;background:linear-gradient(90deg,color-mix(in srgb,var(--c) 68%,#fff),var(--c));border-radius:99px}
.wk{display:flex;align-items:flex-end;gap:7px;height:140px}
.wk>div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:.72rem;color:var(--muted)}
.wk>div>div{width:100%;background:linear-gradient(180deg,#5fd8e4,var(--brand));border-radius:9px 9px 3px 3px;min-height:3px}
.li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--edge);align-items:center}
.li:last-child{border:0}
.badge{display:inline-block;padding:3px 11px;border-radius:99px;font-size:.78rem;font-weight:600;white-space:nowrap;color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent)}

/* Kartu data (tanpa blur supaya scroll tetap ringan) */
.rec{background:var(--surface-s);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:20px;padding:15px 16px;margin-bottom:12px;display:grid;gap:5px;box-shadow:var(--shadow)}
.rh{display:flex;justify-content:space-between;gap:8px;align-items:center}
.rl{display:flex;gap:14px;flex-wrap:wrap}
.note{background:color-mix(in srgb,var(--ink) 6%,transparent);border-radius:14px;padding:9px 12px;white-space:pre-wrap}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
a.lnk,a.wa{color:var(--brand);font-weight:600;text-decoration:none} a.lnk:hover,a.wa:hover{text-decoration:underline}
.th{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.ph{position:relative;width:84px;height:84px}
.ph img{width:100%;height:100%;object-fit:cover;border-radius:14px;border:1px solid var(--line)}
.ph button{position:absolute;top:4px;right:4px;padding:0;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.62);box-shadow:none;line-height:1}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:0 10px} .filters .full{grid-column:1/-1}
.pager{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:12px}

/* Peta */
#map{height:62vh;min-height:360px;border-radius:24px;border:1px solid var(--line);box-shadow:var(--shadow);z-index:0}
.leaflet-popup-content-wrapper{border-radius:16px}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin:8px 0 10px;font-size:.85rem}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:4px}

/* Dialog */
dialog{border:1px solid var(--line);border-radius:28px;padding:22px;width:min(560px,94vw);max-height:92vh;background:var(--surface-s);color:var(--ink);
-webkit-backdrop-filter:blur(30px) saturate(170%);backdrop-filter:blur(30px) saturate(170%);box-shadow:0 24px 70px rgba(0,0,0,.35);animation:pop .25s cubic-bezier(.2,.9,.3,1.2)}
dialog::backdrop{background:rgba(5,20,25,.35);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
@keyframes pop{from{opacity:0;transform:scale(.94)}}
@keyframes sheet{from{transform:translateY(100%)}}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:rgba(18,30,34,.9);color:#fff;padding:11px 20px;border-radius:99px;font-size:.9rem;z-index:99;max-width:90vw;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 8px 24px rgba(0,0,0,.3)}

@media(max-width:760px){
.app{display:block}
.side{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));top:auto;width:auto;height:auto;margin:0;flex-direction:row;padding:6px;border-radius:32px;z-index:50;gap:2px}
.side h1,.side .out{display:none}
.nav{flex:1;flex-direction:column;gap:2px;padding:8px 2px;font-size:.68rem;text-align:center;justify-content:center;border-radius:24px}
.nav svg{width:22px;height:22px}
main{padding:calc(18px + env(safe-area-inset-top)) 14px 120px}
.two{grid-template-columns:1fr}
.toast{bottom:calc(96px + env(safe-area-inset-bottom))}
dialog{margin:auto auto 0;width:100%;max-width:none;border-radius:28px 28px 0 0;padding-bottom:calc(22px + env(safe-area-inset-bottom));animation:sheet .32s cubic-bezier(.2,.9,.3,1)}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
</head>
<body>
<section id="loginSection" class="card login">
  <h2>Masuk</h2>
  <label for="passInput">Password</label>
  <input type="password" id="passInput" autocomplete="current-password">
  <p class="err" id="loginErr"></p>
  <button id="loginBtn" style="width:100%">Masuk</button>
</section>

<div id="mainSection" class="app hidden">
  <nav class="side">
    <h1>Catatan Keliling</h1>
    <button class="nav on" data-v="dash"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg>Dashboard</button>
    <button class="nav" data-v="input"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>Input</button>
    <button class="nav" data-v="riwayat"><svg viewBox="0 0 24 24"><path d="M4 6h.01M4 12h.01M4 18h.01M9 6h12M9 12h12M9 18h12"/></svg>Riwayat</button>
    <button class="nav" data-v="spk"><svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 14l2 2 4-4"/></svg>Supplier</button>
    <button class="nav" data-v="peta"><svg viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>Peta</button>
    <button class="nav out" id="logoutBtn"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>Keluar</button>
  </nav>
  <main>
    <section id="v-dash" class="view">
      <div class="rh"><h2 style="margin:0">Dashboard</h2>
        <select id="period" style="width:auto"><option value="7">7 hari</option><option value="30" selected>30 hari</option><option value="90">90 hari</option><option value="0">Semua</option></select></div>
      <div class="grid" id="stats" style="margin-top:12px"></div>
      <div class="two">
        <div class="card"><h2>Klien per status</h2><div id="barStatus"></div></div>
        <div class="card"><h2>Data baru per minggu</h2><div class="wk" id="wk"></div></div>
      </div>
      <div class="two">
        <div class="card"><h2>Perlu di-follow-up</h2><div id="fuList"></div></div>
        <div class="card"><h2>SPK mau jatuh tempo</h2><div id="spkDue"></div></div>
        <div class="card"><h2>Aktivitas terbaru</h2><div id="recent"></div></div>
      </div>
    </section>

    <section id="v-input" class="view hidden">
      <div class="card"><h2>Input data klien</h2><div id="formInput"></div><button id="saveBtn" style="width:100%">Simpan data</button></div>
    </section>

    <section id="v-riwayat" class="view hidden">
      <div class="card"><h2>Riwayat data</h2>
        <div class="filters">
          <div class="full"><label for="q">Cari</label><input id="q" type="search" placeholder="Nama, alamat, atau catatan"></div>
          <div><label for="stF">Status</label><select id="stF"></select></div>
          <div><label for="pp">Tampil per halaman</label><select id="pp"><option>10</option><option>25</option><option>50</option><option>100</option></select></div>
        </div>
        <p class="muted" id="count"></p>
        <div class="btn-row"><button class="btn-s" id="xlsBtn">Unduh Excel</button><button class="btn-s" id="pdfBtn">Unduh PDF</button></div>
      </div>
      <div id="list"></div>
      <div class="pager" id="pager"></div>
    </section>

    <section id="v-spk" class="view hidden">
      <h2>Supplier SPK</h2>
      <div id="spkList"></div>
    </section>

    <section id="v-detail" class="view hidden"></section>

    <section id="v-peta" class="view hidden">
      <div class="rh"><h2 style="margin:0">Peta</h2><select id="mapSt" style="width:auto"></select></div>
      <div class="legend" id="legend"></div>
      <div id="map"></div>
      <p class="muted" id="mapInfo"></p>
    </section>
  </main>
</div>

<dialog id="spkModal"><h2 style="margin-top:0" id="spkTitle">SPK baru</h2>
  <label>Tanggal mulai</label><input id="sp_m" type="date">
  <label>Tanggal selesai</label><input id="sp_s" type="date">
  <label>Jumlah barang (opsional)</label><input id="sp_j" maxlength="40" placeholder="Contoh: 100 dus">
  <label>Catatan (opsional)</label><textarea id="sp_c" rows="2" maxlength="300"></textarea>
  <p class="err" id="sp_err"></p>
  <div class="btn-row"><button class="btn-s" id="spCancel">Batal</button><button id="spSave">Simpan SPK</button></div>
</dialog>

<dialog id="modal"><h2 style="margin-top:0">Edit data</h2><div id="mBody"></div>
  <div class="btn-row"><button class="btn-s" id="mCancel">Batal</button><button id="mSave">Simpan perubahan</button></div>
</dialog>

<script>
// Ganti dengan URL Web App Apps Script (berakhiran /exec)
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx7BaH87ogbbpuKYctBx8k1lRjJd1yFM0SttL2hPoiqEj7y7mX90tNCidWPRY6lZl4v/exec";

const STATUS = ["Menolak","Ragu-ragu","Tertarik","Siap Ambil","SPK"];
const COL = {"Menolak":"#b3372f","Ragu-ragu":"#c98400","Tertarik":"#2f6fd0","Siap Ambil":"#1b7a4b","SPK":"#7a3fb5"};
const HINT = {"Menolak":"Tidak mau.","Ragu-ragu":"Masih pikir-pikir.","Tertarik":"Mau, tapi belum berani ambil. Menunggu konfirmasi perajin.","Siap Ambil":"Sudah pasti, tinggal diambil.","SPK":"Sudah ambil / sudah SPK."};
const NEXT = {"Tertarik":"Siap Ambil","Siap Ambil":"SPK"};
const NEXT_LABEL = {"Tertarik":"Naikkan ke Siap Ambil","Siap Ambil":"Jadikan SPK"};

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtTime = iso => { const d = new Date(iso); return isNaN(d) ? esc(iso) : d.toLocaleString("id-ID",{dateStyle:"medium",timeStyle:"short"}); };
const fmtDay = iso => { const d = new Date(iso); return isNaN(d) ? esc(iso) : d.toLocaleDateString("id-ID",{dateStyle:"medium"}); };
const badge = s => `<span class="badge" style="--c:${COL[s]||"#666"}">${esc(s)}</span>`;
const thumb = (id, w) => `https://drive.google.com/thumbnail?id=${id}&sz=w${w}`;
const mapUrl = r => (r.lat != null && r.lng != null) ? `https://www.google.com/maps?q=${r.lat},${r.lng}` : (r.maps || "");

let password = sessionStorage.getItem("pw") || "";
let D = [], K = [], S = [], cur = "dash", detailId = null, page = 1;

function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2800); }

async function api(payload){
  if(!SCRIPT_URL.startsWith("https://script.google.com/")) throw new Error("SCRIPT_URL belum diisi.");
  const res = await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify({...payload,password})});
  if(!res.ok) throw new Error("Server membalas error "+res.status);
  const data = await res.json();
  if(data.status !== "success") throw new Error(data.message || "Terjadi kesalahan.");
  return data;
}
async function busy(btn, fn){
  if(btn.disabled) return;
  const t = btn.textContent; btn.disabled = true; btn.textContent = "Memproses...";
  try{ await fn(); } finally { btn.disabled = false; btn.textContent = t; }
}

// ---------- Login ----------
function showApp(){ $("loginSection").classList.add("hidden"); $("mainSection").classList.remove("hidden"); muat(); }
$("loginBtn").onclick = () => busy($("loginBtn"), async () => {
  $("loginErr").textContent = ""; password = $("passInput").value;
  try{ await api({action:"login"}); sessionStorage.setItem("pw",password); showApp(); }
  catch(e){ password=""; $("loginErr").textContent = e.message; }
});
$("passInput").onkeydown = e => { if(e.key==="Enter") $("loginBtn").click(); };
$("logoutBtn").onclick = () => { sessionStorage.removeItem("pw"); location.reload(); };

async function muat(){
  try{ const r = await api({action:"list"}); D = r.data; K = r.kroscek; S = r.spk || []; renderAll(); }
  catch(e){ toast("Gagal memuat data: "+e.message); }
}

// ---------- Foto ----------
const compress = f => new Promise((res,rej) => {
  const img = new Image(), u = URL.createObjectURL(f);
  img.onload = () => { const s = Math.min(1,1280/Math.max(img.width,img.height)), c = document.createElement("canvas");
    c.width = img.width*s; c.height = img.height*s; c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(u); res(c.toDataURL("image/jpeg",.75)); };
  img.onerror = () => rej(new Error("Foto tidak bisa dibaca.")); img.src = u;
});
const photoHtml = p => `<div class="btn-row"><button type="button" class="btn-s" id="${p}cam">Ambil foto</button><button type="button" class="btn-s" id="${p}gal">Dari galeri</button></div>
<input type="file" accept="image/*" capture="environment" id="${p}fc" class="hidden"><input type="file" accept="image/*" multiple id="${p}fg" class="hidden"><div class="th" id="${p}prev"></div>`;
function initPhotos(p, initial = []){
  let list = initial.map(id => ({id}));
  const draw = () => $(p+"prev").innerHTML = list.map((f,i) => `<div class="ph"><img src="${f.data||thumb(f.id,300)}" alt=""><button type="button" data-i="${i}" aria-label="Hapus foto">×</button></div>`).join("");
  $(p+"prev").onclick = e => { const b = e.target.closest("button"); if(b){ list.splice(+b.dataset.i,1); draw(); } };
  $(p+"cam").onclick = () => $(p+"fc").click(); $(p+"gal").onclick = () => $(p+"fg").click();
  const add = async e => { try{ for(const f of e.target.files) list.push({data: await compress(f)}); }catch(x){ toast(x.message); } e.target.value = ""; draw(); };
  $(p+"fc").onchange = add; $(p+"fg").onchange = add; draw();
  return { count: () => list.length,
    async upload(){ for(const f of list){ if(!f.id){ f.id = (await api({action:"upload",data:f.data})).id; delete f.data; } } return list.map(f => f.id); } };
}

function initForm(p, r = {}){
  const g = id => $(p+id); let lat = r.lat ?? null, lng = r.lng ?? null;
  g("nama").value = r.nama||""; g("alamat").value = r.alamat||""; g("hp").value = r.hp||"";
  g("st").value = r.status||"Tertarik"; g("est").value = r.estimasi && r.estimasi!=="-" ? r.estimasi : "";
  g("fu").value = r.fu||""; g("mp").value = r.maps||""; g("cat").value = r.catatan||"";
  const sync = () => { const s = g("st").value;
    g("wEst").classList.toggle("hidden", !["Tertarik","Siap Ambil","SPK"].includes(s));
    g("wFu").classList.toggle("hidden", !["Tertarik","Ragu-ragu"].includes(s));
    g("hint").textContent = HINT[s]; };
  g("st").onchange = sync; sync();
  g("mp").oninput = () => { lat = lng = null; g("gi").textContent = ""; };
  g("gps").onclick = () => {
    if(!navigator.geolocation) return toast("GPS tidak didukung di browser ini.");
    g("gi").textContent = "Mencari lokasi...";
    navigator.geolocation.getCurrentPosition(pos => {
      lat = +pos.coords.latitude.toFixed(6); lng = +pos.coords.longitude.toFixed(6);
      g("mp").value = `https://www.google.com/maps?q=${lat},${lng}`; g("gi").textContent = "Lokasi berhasil diambil.";
    }, () => g("gi").textContent = "Gagal mengambil lokasi. Izinkan akses lokasi di browser.", {enableHighAccuracy:true,timeout:15000});
  };
  const ph = initPhotos(p, r.foto||[]);
  return { async collect(){
    g("err").textContent = "";
    const nama = g("nama").value.trim(), hp = g("hp").value.trim();
    if(!nama) throw new Error("Nama wajib diisi.");
    if(hp && !/^\+?[\d\s-]{8,16}$/.test(hp)) throw new Error("No HP harus 8-16 angka.");
    const s = g("st").value, foto = await ph.upload();
    return { nama, alamat:g("alamat").value, hp, status:s,
      estimasi: ["Tertarik","Siap Ambil","SPK"].includes(s) ? g("est").value : "",
      fu: ["Tertarik","Ragu-ragu"].includes(s) ? g("fu").value : "",
      maps:g("mp").value.trim(), lat, lng, catatan:g("cat").value, foto };
  }, err: m => g("err").textContent = m };
}

function inPeriod(rows){ const d = +$("period").value; if(!d) return rows;

function renderDash(){
  const rows = inPeriod(D), cnt = s => rows.filter(r => r.status===s).length;
  $("stats").innerHTML = `<div class="stat go" data-go="riwayat"><span class="muted">Total klien</span><b>${rows.length}</b></div>` +
    STATUS.map(s => `<div class="stat go" data-go="riwayat" data-st="${s}" style="--c:${COL[s]}"><span class="muted">${s}</span><b>${cnt(s)}</b></div>`).join("");
  const mx = Math.max(1, ...STATUS.map(cnt));
  $("barStatus").innerHTML = STATUS.map(s => `<div class="bar go" data-go="riwayat" data-st="${s}" style="--c:${COL[s]}"><span>${s}</span><div><div style="width:${cnt(s)/mx*100}%"></div></div><b>${cnt(s)}</b></div>`).join("");
  const now = new Date(); now.setHours(0,0,0,0); const mon = new Date(now); mon.setDate(now.getDate() - (now.getDay()+6)%7);
  const wk = []; for(let i=7;i>=0;i--){ const s = new Date(mon); s.setDate(mon.getDate()-i*7); const e = new Date(s); e.setDate(s.getDate()+7);
    wk.push({l:s.toLocaleDateString("id-ID",{day:"numeric",month:"short"}), n:D.filter(r => { const t = new Date(r.waktu); return t>=s && t<e; }).length}); }
  const wm = Math.max(1, ...wk.map(w => w.n));
  $("wk").innerHTML = wk.map(w => `<div><span>${w.n}</span><div style="height:${w.n/wm*80}%"></div><span>${w.l}</span></div>`).join("");

  $("recent").innerHTML = D.slice(0,6).map(r => `<div class="li go" data-go="riwayat" data-q="${esc(r.nama)}"><span><b>${esc(r.nama)}</b><br><span class="muted">${fmtTime(r.waktu)}</span></span>${badge(r.status)}</div>`).join("") || `<p class="muted">Belum ada data.</p>`;

function renderRiwayat(){

const sOf = id => S.filter(s => s.sid===id).sort((a,b) => a.mulai.localeCompare(b.mulai));

function spkInfo(id){

  }
  else if(a==="del" && r){
    if(!confirm(`Hapus data "${r.nama}"? Laporan kroscek miliknya ikut terhapus.`)) return;
    const i = D.indexOf(r), ks = K.filter(k => k.sid===id); D.splice(i,1); K = K.filter(k => k.sid!==id); renderAll();
    try{ await api({action:"delete",id}); toast("Data dihapus"); }
    catch(err){ D.splice(i,0,r); K.push(...ks); renderAll(); toast("Gagal menghapus: "+err.message); }
  }
  else if(a==="delk"){
    if(!confirm("Hapus laporan kroscek ini?")) return;
    const k = K.find(x => x.id===id), i = K.indexOf(k); K.splice(i,1); renderDetail();
    try{ await api({action:"kroscekDelete",id}); toast("Laporan dihapus"); }
    catch(err){ K.splice(i,0,k); renderDetail(); toast("Gagal menghapus: "+err.message); }
  }
  else if(a==="dlfoto") busy(b, () => downloadFoto(id).catch(err => toast("Gagal: "+err.message)));
  else if(a==="allfoto" && r) busy(b, async () => {
    const all = kOf(id).flatMap(k => k.foto); if(!all.length) return toast("Belum ada foto.");
    try{ for(const f of all) await downloadFoto(f); }catch(err){ toast("Gagal: "+err.message); }
  });
  else if(a==="xls" && r) exportSupplierXls(r);
  else if(a==="pdf" && r) busy(b, () => exportSupplierPdf(r).catch(err => toast("Gagal membuat PDF: "+err.message)));
});

// ---------- Ekspor ----------
const cl = v => String(v ?? "").replace(/[^\u0000-\u00FF]/g,"");
const lt = iso => new Date(iso).toLocaleString("id-ID");
function exportRows(){ return filtered().map(r => ({Waktu:lt(r.waktu),Nama:r.nama,Alamat:r.alamat,"No HP":r.hp,Status:r.status,"Est. Barang/Mgg":r.estimasi,"Follow-up":r.fu,Lokasi:mapUrl(r),Catatan:r.catatan})); }
$("xlsBtn").onclick = () => { const rows = exportRows(); if(!rows.length) return toast("Tidak ada data untuk diunduh");
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), "Rekap"); XLSX.writeFile(wb,"Rekap_Keliling.xlsx"); };
$("pdfBtn").onclick = () => { const rows = exportRows(); if(!rows.length) return toast("Tidak ada data untuk diunduh");
  const doc = new window.jspdf.jsPDF({orientation:"landscape",format:"a4"}), keys = Object.keys(rows[0]).filter(k => k!=="Lokasi");
  doc.setFontSize(13); doc.text("Rekap Keliling Lapangan",14,14); doc.setFontSize(9); doc.text(`Dicetak ${new Date().toLocaleString("id-ID")} - ${rows.length} data`,14,19);
  doc.autoTable({startY:23,margin:{left:14,right:14},head:[keys],body:rows.map(r => keys.map(k => cl(r[k]))),styles:{fontSize:8,cellPadding:2,textColor:0},headStyles:{fillColor:[15,92,102],textColor:255}});
  doc.save("Rekap_Keliling.pdf"); };

function exportSupplierXls(r){
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([["Nama",r.nama],["No HP",r.hp],["Alamat",r.alamat],["Lokasi",mapUrl(r)],["Tanggal SPK",r.tglSpk?lt(r.tglSpk):""],["Estimasi/minggu",r.estimasi],["Catatan awal",r.catatan]]), "Supplier");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(kOf(r.id).map(k => ({Waktu:lt(k.waktu),Catatan:k.catatan,"Jumlah Foto":k.foto.length,"Link Foto":k.foto.map(f => `https://drive.google.com/file/d/${f}/view`).join("\n")}))), "Kroscek");
  const sp = sOf(r.id);
  if(sp.length) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(sp.map((s,i) => ({"SPK ke":i+1,Mulai:s.mulai,Selesai:s.selesai,Jumlah:s.jumlah,Catatan:s.catatan}))), "SPK");
  XLSX.writeFile(wb, `Kroscek_${cl(r.nama).replace(/\W+/g,"_")}.xlsx`);
}
async function exportSupplierPdf(r){
  const doc = new window.jspdf.jsPDF(), W = 210, M = 14; let y = 16;
  doc.setFontSize(14); doc.text("Laporan Kroscek Supplier",M,y); y += 8; doc.setFontSize(10);
  [["Nama",r.nama],["No HP",r.hp],["Alamat",r.alamat],["Lokasi",mapUrl(r)],["Tanggal SPK",r.tglSpk?lt(r.tglSpk):"-"]].forEach(([k,v]) => {
    const t = doc.splitTextToSize(`${k}: ${cl(v)}`, W-2*M); doc.text(t,M,y); y += t.length*5; });
  const sp = sOf(r.id);
  if(sp.length){
    y += 5; if(y>260){ doc.addPage(); y = 16; }
    doc.setFont(undefined,"bold"); doc.text("Riwayat SPK",M,y); doc.setFont(undefined,"normal"); y += 5;
    sp.forEach((s,i) => {
      const t = doc.splitTextToSize(cl(`SPK ke-${i+1}: ${fmtDay(s.mulai)} - ${fmtDay(s.selesai)}` + (s.jumlah ? ` | ${s.jumlah}` : "") + (s.catatan ? ` | ${s.catatan}` : "")), W-2*M);
      if(y + t.length*5 > 280){ doc.addPage(); y = 16; }
      doc.text(t,M,y); y += t.length*5;
    });
  }
  for(const k of kOf(r.id)){
    y += 5; if(y>265){ doc.addPage(); y = 16; }
    doc.setFont(undefined,"bold"); doc.text(lt(k.waktu),M,y); doc.setFont(undefined,"normal"); y += 5;
    const t = doc.splitTextToSize(cl(k.catatan)||"-", W-2*M); doc.text(t,M,y); y += t.length*5+2;
    let col = 0, rh = 0;
    for(const id of k.foto){
      const {data} = await api({action:"foto",id}), p = doc.getImageProperties(data), s = Math.min(85/p.width, 85/p.height), w = p.width*s, h = p.height*s;
      if(col===0 && y+85>285){ doc.addPage(); y = 16; }
      doc.addImage(data,"JPEG",M+col*92,y,w,h); rh = Math.max(rh,h);
      if(col===1){ y += rh+4; rh = 0; col = 0; } else col = 1;
    }
    if(col===1) y += rh+4;
  }
  doc.save(`Kroscek_${cl(r.nama).replace(/\W+/g,"_")}.pdf`);
}

let spkCtx = null;
function openSpk(sid, rec, promote){
  spkCtx = {sid, id: rec?.id, promote};
  $("spkTitle").textContent = rec ? "Edit SPK" : "SPK baru";
  $("sp_m").value = rec?.mulai || todayStr(); $("sp_s").value = rec?.selesai || "";
  $("sp_j").value = rec?.jumlah || ""; $("sp_c").value = rec?.catatan || "";
  $("sp_err").textContent = ""; $("spkModal").showModal();
}
$("spCancel").onclick = () => $("spkModal").close();
$("spSave").onclick = () => busy($("spSave"), async () => {
  const m = $("sp_m").value, s = $("sp_s").value;
  if(!m || !s) return $("sp_err").textContent = "Tanggal mulai dan selesai wajib diisi.";
  if(s < m) return $("sp_err").textContent = "Tanggal selesai tidak boleh sebelum mulai.";
  try{
    const c = spkCtx, r = D.find(x => x.id===c.sid);
    if(c.promote){ const old = {...r}; r.status = "SPK";
      try{ await api({action:"update",...payload(r)}); }catch(e){ Object.assign(r, old); throw e; } }
    const res = await api({action:"spkSave",id:c.id,sid:c.sid,mulai:m,selesai:s,jumlah:$("sp_j").value,catatan:$("sp_c").value});
    const i = S.findIndex(x => x.id===res.rec.id); if(i>=0) S[i] = res.rec; else S.push(res.rec);
    $("spkModal").close(); renderAll(); toast("SPK tersimpan");
  }catch(e){ $("sp_err").textContent = e.message; }
});

document.addEventListener("click", e => {
  if(e.target.closest("[data-act]")) return;
  const g = e.target.closest("[data-go]"); if(!g) return;
  const d = g.dataset;
  if(d.go==="detail"){ detailId = d.id; showView("detail"); return; }
  if(d.st==="SPK"){ showView("spk"); return; }
  $("stF").value = d.st || ""; $("q").value = d.q || ""; page = 1;
  renderRiwayat(); showView("riwayat");
});

resetInput();
if(password) showApp();
